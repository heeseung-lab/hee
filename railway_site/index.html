<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브랜드 리뷰 모니터링</title><style>:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--text:#171717;--muted:#737373;--red:#b91c1c;--green:#166534;--amber:#92400e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.head h1{margin:0;font-size:30px}.muted{color:var(--muted)}.searchbox,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.searchbox{margin:18px 0}.brandrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}.brandrow input,.toolbar input,.toolbar select{border:1px solid #d4d4d8;border-radius:11px;padding:13px;font-size:15px;background:#fff}.btn{border:0;border-radius:11px;padding:13px 17px;font-weight:800;cursor:pointer;background:#171717;color:#fff}.btn.alt{background:#fff;color:#171717;border:1px solid #d4d4d8}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:12px;padding:12px 14px;background:#fafafa;border-radius:12px}.progress{height:8px;background:#eceff3;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#171717}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:6px}.metric small{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1.2fr .7fr auto;gap:8px;margin-bottom:14px}.layout{display:grid;grid-template-columns:1fr 1.45fr;gap:14px}.stores{max-height:720px;overflow:auto}.store{padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.store:hover{background:#fafafa}.top{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.critical{background:#fee2e2;color:var(--red)}.warning{background:#fef3c7;color:var(--amber)}.good{background:#dcfce7;color:var(--green)}.failed{background:#f3f4f6;color:#52525b}.review{padding:15px 0;border-bottom:1px solid #eee;line-height:1.7}.bad{background:#fee2e2;color:var(--red);font-weight:800;padding:2px 4px;border-radius:4px}.goodword{background:#dcfce7;color:var(--green);font-weight:800;padding:2px 4px;border-radius:4px}.empty{text-align:center;color:var(--muted);padding:45px 12px}.error{color:var(--red)}@media(max-width:850px){.summary,.layout,.toolbar,.brandrow{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.wrap{padding:15px}}</style></head><body><div class="wrap"><div class="head"><div><h1><span id="brandTitle">브랜드</span> 리뷰 모니터링</h1><div class="muted" style="margin-top:6px">브랜드 검색 → 전체 매장 탐색 → 최근 7일 리뷰 검사 → 위험지점 우선관리</div></div><button class="btn alt" id="healthBtn">엔진 확인</button></div><div class="searchbox"><div class="brandrow"><input id="brand" placeholder="예: 청년다방, 한마음정육식당, 텐퍼센트커피"><button class="btn" id="searchBtn">검색 + 전체검사</button><button class="btn alt" id="stopBtn" disabled>중지</button></div><div id="status" class="status">브랜드명을 입력하고 검색하면 바로 시작합니다.</div><div class="progress"><i id="bar"></i></div></div><div class="summary"><div class="card metric"><span>전체 매장</span><b id="mStores">0</b><small>검색 기준 100%</small></div><div class="card metric"><span>수집 완료</span><b id="mOk">0</b><small id="rOk">0%</small></div><div class="card metric"><span>최근 7일 리뷰</span><b id="mReviews">0</b><small id="rFail">실패 0%</small></div><div class="card metric"><span>불량 리뷰</span><b id="mBad">0</b><small id="rBad">0%</small></div><div class="card metric"><span>집중관리</span><b id="mCritical">0</b><small id="rCritical">0%</small></div></div><div class="card toolbar"><input id="storeSearch" placeholder="매장명 또는 주소 검색"><select id="filter"><option value="all">전체 상태</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option><option value="failed">수집실패</option></select><span class="muted" style="align-self:center">위험도 높은 순</span></div><div class="layout"><div class="card"><b>매장 위험도</b><div id="stores" class="stores"><div class="empty">아직 검색한 브랜드가 없습니다.</div></div></div><div class="card"><b id="detailTitle">리뷰 상세</b><div id="reviews" class="empty">왼쪽 매장을 선택하면 리뷰가 표시됩니다.</div></div></div></div><script>let DATA={brand:'',stores:[]},running=false;const $=x=>document.getElementById(x),pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'0.0%',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function level(s){if(s.error)return'failed';if(!s.reviews?.length)return'good';const max=Math.max(...s.reviews.map(r=>r.score||0));return max>=20?'critical':max>=10?'warning':'good'}function label(l){return{critical:'집중관리',warning:'주의',good:'정상',failed:'수집실패'}[l]}function badge(l){return`<span class="pill ${l}">${label(l)}</span>`}function stats(s){return{level:level(s),bad:(s.reviews||[]).filter(r=>(r.bad_hits||[]).length).length}}async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`HTTP ${r.status}`);return d}function render(){const rows=DATA.stores.map((s,i)=>({s,i,st:stats(s)}));const q=$('storeSearch').value.trim(),f=$('filter').value,rank={critical:4,warning:3,failed:2,good:1};const list=rows.filter(x=>(!q||(x.s.name+x.s.address).includes(q))&&(f==='all'||x.st.level===f)).sort((a,b)=>rank[b.st.level]-rank[a.st.level]||b.st.bad-a.st.bad||a.s.name.localeCompare(b.s.name));const total=rows.length,ok=rows.filter(x=>x.s.checked&&!x.s.error).length,fail=rows.filter(x=>x.s.error).length,reviews=rows.reduce((n,x)=>n+(x.s.reviews?.length||0),0),bad=rows.reduce((n,x)=>n+x.st.bad,0),critical=rows.filter(x=>x.st.level==='critical').length;$('brandTitle').textContent=DATA.brand||'브랜드';$('mStores').textContent=total;$('mOk').textContent=ok;$('mReviews').textContent=reviews;$('mBad').textContent=bad;$('mCritical').textContent=critical;$('rOk').textContent='수집완료율 '+pct(ok,total);$('rFail').textContent='수집실패율 '+pct(fail,total);$('rBad').textContent='불량리뷰율 '+pct(bad,reviews);$('rCritical').textContent='집중관리율 '+pct(critical,total);$('stores').innerHTML=list.length?list.map(x=>`<div class="store" data-i="${x.i}"><div class="top"><b>${esc(x.s.name)}</b>${badge(x.st.level)}</div><div class="muted">${esc(x.s.address||'')} · ID ${esc(x.s.place_id||'-')}</div><div class="muted">리뷰 ${x.s.reviews?.length||0} · 불량 ${x.st.bad}${x.s.error?' · '+esc(x.s.error):''}</div></div>`).join(''):'<div class="empty">표시할 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(DATA.stores[+e.dataset.i]))}function show(s){$('detailTitle').textContent=s.name+' · 최근 7일';if(!s.reviews?.length){$('reviews').innerHTML=`<div class="empty">${s.error?`<span class="error">${esc(s.error)}</span><br><br>`:''}최근 7일 리뷰가 없습니다.</div>`;return}$('reviews').innerHTML=s.reviews.map(r=>{let t=esc(r.text);(r.bad_hits||[]).forEach(w=>t=t.replaceAll(esc(w),`<span class="bad">${esc(w)}</span>`));(r.good_hits||[]).forEach(w=>t=t.replaceAll(esc(w),`<span class="goodword">${esc(w)}</span>`));const l=(r.score||0)>=20?'critical':(r.score||0)>=10?'warning':'good';return`<div class="review">${badge(l)}<div style="margin-top:8px">${t}</div><div class="muted">불량 ${(r.bad_hits||[]).join(', ')||'-'} · 좋은 ${(r.good_hits||[]).join(', ')||'-'} · ${esc(r.created_at||'')}</div></div>`}).join('')}async function run(){const brand=$('brand').value.trim();if(brand.length<2||running)return;running=true;$('searchBtn').disabled=true;$('stopBtn').disabled=false;$('status').textContent=`${brand} · 네이버 지도에서 매장 검색 중…`;$('bar').style.width='3%';try{const d=await api('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand})});DATA={brand,stores:(d.stores||[]).map(s=>({...s,reviews:[],error:null,checked:false}))};render();if(!DATA.stores.length)throw Error('검색된 매장이 없습니다');$('status').textContent=`${brand} · 네이버 지도에서 ${DATA.stores.length}개 매장 발견 · 리뷰 검사 시작`;let ok=0,fail=0;for(let i=0;i<DATA.stores.length&&running;i++){const s=DATA.stores[i];$('status').textContent=`${brand} · ${i+1}/${DATA.stores.length} ${s.name} 검사 중 · 성공 ${ok} · 실패 ${fail}`;$('bar').style.width=((i+1)/DATA.stores.length*100)+'%';try{const x=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,address:s.address,place_id:s.place_id,days:7})});s.reviews=x.reviews||[];s.place_id=x.place_id||s.place_id;s.checked=true;ok++;}catch(e){s.error=e.message;s.checked=false;fail++;}render()}$('status').textContent=running?`${brand} 검사 완료 · 매장 ${DATA.stores.length}개 · 성공 ${ok} · 실패 ${fail}`:`${brand} 검사를 중지했습니다.`}catch(e){$('status').innerHTML=`<span class="error">실패 · ${esc(e.message)}</span>`}finally{running=false;$('searchBtn').disabled=false;$('stopBtn').disabled=true}}$('searchBtn').onclick=run;$('stopBtn').onclick=()=>running=false;$('brand').onkeydown=e=>{if(e.key==='Enter')run()};$('storeSearch').oninput=render;$('filter').onchange=render;$('healthBtn').onclick=async()=>{try{const d=await api('/api/health');$('status').textContent=`엔진 정상 · ${d.service} v${d.version}`}catch(e){$('status').textContent='엔진 오류 · '+e.message}};</script></body></html>
