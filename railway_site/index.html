<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네이버플레이스 리뷰 관리</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#d8dde5;--text:#15171a;--muted:#667085;--blue:#175cd3;--red:#b42318;--green:#067647;--amber:#b54708;--ink:#101828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px}.head h1{margin:0;font-size:28px}.muted{color:var(--muted)}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px}.grid{display:grid;gap:12px}.search{grid-template-columns:minmax(240px,1fr) auto auto}.schedule{grid-template-columns:1fr auto auto auto auto auto;margin-top:10px}.stats{grid-template-columns:repeat(5,1fr);margin:14px 0}.main{grid-template-columns:minmax(520px,1.2fr) minmax(420px,.8fr)}input,select{border:1px solid #c9d0da;border-radius:8px;background:#fff;padding:11px 12px;font-size:15px;min-width:0}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:800;background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}.btn.alt{background:#fff;color:var(--ink);border:1px solid #c9d0da}.btn.blue{background:var(--blue)}.btn:disabled{opacity:.45}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;font-size:27px;margin-top:4px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;border:1px solid #e7eaf0;background:#f8fafc;border-radius:8px;padding:10px 12px}.bar{height:10px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;width:0;height:100%;background:var(--blue);transition:width .2s}.tableWrap{max-height:690px;overflow:auto}.store{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #eef1f4;padding:13px 0;cursor:pointer}.store:hover{background:#fafbfc}.name{font-weight:900}.sub{color:var(--muted);font-size:12px;margin-top:5px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.normal{background:#dcfae6;color:var(--green)}.warn{background:#fef0c7;color:var(--amber)}.danger{background:#fee4e2;color:var(--red)}.pending{background:#e0e7ff;color:#3730a3}.fail{background:#f2f4f7;color:#475467}.review,.rank{border-bottom:1px solid #eef1f4;padding:13px 0}.reviewText{line-height:1.7;margin-top:8px}.bad{background:#fee4e2;color:var(--red);font-weight:800;padding:2px 4px;border-radius:4px}.good{background:#dcfae6;color:var(--green);font-weight:800;padding:2px 4px;border-radius:4px}.picked{outline:2px solid #175cd3}.empty{text-align:center;color:var(--muted);padding:34px 12px}.log{max-height:120px;overflow:auto;background:#111827;color:#d1d5db;border-radius:8px;padding:10px 12px;font:12px/1.55 Consolas,monospace;margin-top:10px}.rank{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{background:#fff;color:var(--ink);border:1px solid #c9d0da}.tab.active{background:var(--ink);color:#fff}.hide{display:none}.keywordBoard{margin-top:12px;border-top:1px solid #eef1f4;padding-top:12px}.keywordHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.keywordHead strong{font-size:15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #c9d0da;background:#fff;color:#1f2937;border-radius:999px;padding:7px 10px;font-weight:800;cursor:pointer}.chip.badChip.active{border-color:#fecdca;background:#fee4e2;color:var(--red)}.chip.goodChip.active{border-color:#abefc6;background:#dcfae6;color:var(--green)}.customKeyword{display:grid;grid-template-columns:minmax(160px,240px) auto;gap:8px;margin-top:9px}.selectedWords{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:980px){.search,.schedule,.stats,.main,.customKeyword{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.btn{width:100%}.tools{display:grid}}@media print{body{background:#fff}.search,.schedule,.tools,.bar,.log,.tabs,#healthBtn,.keywordBoard{display:none!important}.wrap{max-width:none;padding:8px}.panel,.card{border-color:#ccc;break-inside:avoid}.main{grid-template-columns:1fr}.tableWrap{max-height:none;overflow:visible}.store,.review,.rank{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>네이버플레이스 리뷰 관리</h1><div class="muted">브랜드 검색으로 매장을 수집하고, 매장별 최근 리뷰 10개를 확인합니다.</div></div><button class="btn alt" id="healthBtn">엔진 확인</button></div>
  <section class="panel">
    <div class="grid search"><input id="brand" placeholder="브랜드명 입력 예: 솔솥"><button class="btn blue" id="searchBtn">매장 검색</button><button class="btn" id="checkBtn" disabled>최근 리뷰 10개 검사</button></div>
    <div class="grid schedule"><select id="enabled"><option value="true">실시간 검사 켜기</option><option value="false">실시간 검사 끄기</option></select><select id="frequency"><option value="daily">매일</option><option value="weekly">매주</option></select><select id="weekday"><option value="mon">월요일</option><option value="tue">화요일</option><option value="wed">수요일</option><option value="thu">목요일</option><option value="fri">금요일</option><option value="sat">토요일</option><option value="sun">일요일</option></select><input id="time" type="time" value="09:00"><button class="btn alt" id="saveScheduleBtn">예약 저장</button><button class="btn alt" id="runScheduleBtn">예약검사 즉시 실행</button></div>
    <div class="tools"><button class="btn alt" id="excelBtn">엑셀 다운로드</button><button class="btn alt" id="pdfBtn">PDF 내보내기</button><button class="btn alt" id="printBtn">인쇄</button><button class="btn alt" id="stopBtn" disabled>중지</button></div>
    <div class="keywordBoard"><div class="keywordHead"><strong>리뷰 검색 단어</strong><button class="btn alt" id="clearKeywordsBtn" type="button">선택 해제</button></div><div class="chips" id="keywordChips"></div><div class="customKeyword"><input id="customKeyword" placeholder="직접 입력"><button class="btn alt" id="addKeywordBtn" type="button">단어 추가</button></div><div class="selectedWords" id="selectedWords">선택한 단어가 없습니다.</div></div>
    <div class="status" id="status">브랜드명을 입력하고 매장 검색을 누르세요.</div><div class="bar"><i id="bar"></i></div><div class="log" id="log"></div>
  </section>
  <section class="grid stats"><div class="card stat"><span>검색 매장</span><b id="mStores">0</b></div><div class="card stat"><span>검사 완료</span><b id="mChecked">0</b></div><div class="card stat"><span>최근 리뷰</span><b id="mReviews">0</b></div><div class="card stat"><span>불만 리뷰</span><b id="mBad">0</b></div><div class="card stat"><span>집중관리</span><b id="mDanger">0</b></div></section>
  <section class="grid main"><div class="panel"><div class="tabs"><button class="btn tab active" data-view="stores">매장 현황</button><button class="btn tab" data-view="praise">칭찬 TOP 10</button></div><div id="storesView"><div class="grid" style="grid-template-columns:1fr auto;margin-bottom:10px"><input id="storeFilter" placeholder="매장명, 주소, Place ID 검색"><select id="sort"><option value="risk">위험도 높은 순</option><option value="name">매장명 순</option><option value="praise">칭찬 많은 순</option></select></div><div id="stores" class="tableWrap"><div class="empty">검색된 매장이 없습니다.</div></div></div><div id="praiseView" class="hide"><div id="top10"><div class="empty">리뷰 검사 후 표시됩니다.</div></div></div></div><div class="panel"><h3 id="detailTitle" style="margin:0 0 8px">리뷰 상세</h3><div id="detail" class="empty">매장을 선택하면 최근 리뷰 10개와 친절/불만 분석이 표시됩니다.</div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);const BAD_WORDS=['불친절','친절하지','싸가지','무례','기분 나쁨','불쾌','짜증','맛없','별로','최악','위생','더러','머리카락','이물질','오래 걸','늦게','대기','비싸','양이 적','실망','다신'];const GOOD_WORDS=['친절','상냥','맛있','추천','깨끗','만족','좋았','좋아요','최고','재방문','빠르','푸짐','깔끔','감사','신선'];let DATA={brand:'',stores:[]},running=false,selectedStore=null,selectedKeywords=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,opt){const r=await fetch(path,opt);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={ok:false,error:t||r.statusText}}if(!r.ok||d.ok===false)throw new Error(d.error||r.statusText);return d}function log(s){const e=document.createElement('div');e.textContent=new Date().toLocaleTimeString('ko-KR')+' · '+s;$('log').prepend(e)}function bar(n){$('bar').style.width=Math.max(0,Math.min(100,n))+'%'}function resetDetail(){selectedStore=null;$('detailTitle').textContent='리뷰 상세';$('detail').className='empty';$('detail').innerHTML='매장을 선택하면 최근 리뷰 10개와 친절/불만 분석이 표시됩니다.'}function counts(s){const reviews=s.reviews||[],bad=reviews.filter(r=>(r.bad_hits||[]).length).length,good=reviews.filter(r=>(r.good_hits||[]).length).length,max=Math.max(0,...reviews.map(r=>r.score||0));return{reviews:reviews.length,bad,good,score:max}}function statusOf(s){if(s.error)return'fail';if(!s.checked)return'pending';const c=counts(s);if(c.score>=20)return'danger';if(c.score>=10)return'warn';return'normal'}function label(k){return{pending:'대기',normal:'정상',warn:'주의',danger:'집중관리',fail:'오류'}[k]||k}function badge(k){return`<span class="pill ${k}">${label(k)}</span>`}function reviewHasKeyword(r){if(!selectedKeywords.length)return true;const text=String(r.text||'');const hits=[...(r.bad_hits||[]),...(r.good_hits||[])].join(' ');return selectedKeywords.some(w=>text.includes(w)||hits.includes(w))}function storeHasKeyword(s){if(!selectedKeywords.length)return true;return (s.reviews||[]).some(reviewHasKeyword)}function summary(){const rows=DATA.stores,total=rows.length,checked=rows.filter(s=>s.checked).length,reviews=rows.reduce((n,s)=>n+counts(s).reviews,0),bad=rows.reduce((n,s)=>n+counts(s).bad,0),danger=rows.filter(s=>statusOf(s)==='danger').length;$('mStores').textContent=total;$('mChecked').textContent=checked;$('mReviews').textContent=reviews;$('mBad').textContent=bad;$('mDanger').textContent=danger}function sortedRows(){const q=$('storeFilter').value.trim().toLowerCase();let rows=DATA.stores.map((s,i)=>({s,i,c:counts(s),st:statusOf(s)}));if(q)rows=rows.filter(x=>[x.s.name,x.s.address,x.s.place_id].some(v=>String(v||'').toLowerCase().includes(q)));if(selectedKeywords.length)rows=rows.filter(x=>storeHasKeyword(x.s));const sort=$('sort').value;if(sort==='name')rows.sort((a,b)=>(a.s.name||'').localeCompare(b.s.name||''));else if(sort==='praise')rows.sort((a,b)=>b.c.good-a.c.good||b.c.reviews-a.c.reviews);else rows.sort((a,b)=>({danger:4,warn:3,fail:2,pending:1,normal:0}[b.st]-{danger:4,warn:3,fail:2,pending:1,normal:0}[a.st])||b.c.bad-a.c.bad);return rows}function renderKeywords(){const html=[...BAD_WORDS.map(w=>({w,t:'badChip'})),...GOOD_WORDS.map(w=>({w,t:'goodChip'}))].map(x=>`<button type="button" class="chip ${x.t} ${selectedKeywords.includes(x.w)?'active':''}" data-word="${esc(x.w)}">${esc(x.w)}</button>`).join('');$('keywordChips').innerHTML=html;document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>toggleKeyword(b.dataset.word));$('selectedWords').textContent=selectedKeywords.length?'선택 단어: '+selectedKeywords.join(', '):'선택한 단어가 없습니다.'}function toggleKeyword(word){selectedKeywords=selectedKeywords.includes(word)?selectedKeywords.filter(x=>x!==word):[...selectedKeywords,word];renderKeywords();render();if(selectedStore)show(selectedStore)}function addKeyword(){const word=$('customKeyword').value.trim();if(!word)return;if(!selectedKeywords.includes(word))selectedKeywords.push(word);$('customKeyword').value='';renderKeywords();render();if(selectedStore)show(selectedStore)}function render(){summary();const rows=sortedRows();$('stores').innerHTML=rows.length?rows.map(x=>`<div class="store" data-i="${x.i}"><div><div class="name">${esc(x.s.name||DATA.brand)}</div><div class="sub">ID ${esc(x.s.place_id||'-')} · ${esc(x.s.address||'주소 없음')}</div><div class="sub">최근리뷰 ${x.c.reviews} · 불만 ${x.c.bad} · 칭찬 ${x.c.good}${x.s.error?' · '+esc(x.s.error):''}</div></div><div>${badge(x.st)}</div></div>`).join(''):selectedKeywords.length?'<div class="empty">선택한 단어가 들어간 리뷰가 없습니다.</div>':'<div class="empty">표시할 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(DATA.stores[+e.dataset.i]));const top=DATA.stores.filter(s=>s.checked).map(s=>({s,c:counts(s)})).sort((a,b)=>b.c.good-a.c.good||b.c.reviews-a.c.reviews).slice(0,10);$('top10').innerHTML=top.length?top.map((x,i)=>`<div class="rank"><b>${i+1}</b><div><strong>${esc(x.s.name)}</strong><div class="sub">ID ${esc(x.s.place_id)} · ${esc(x.s.address||'')}</div></div><b style="color:var(--green)">${x.c.good}</b></div>`).join(''):'<div class="empty">리뷰 검사 후 표시됩니다.</div>'}function mark(text,words,cls){let out=esc(text);(words||[]).forEach(w=>out=out.replaceAll(esc(w),`<span class="${cls}">${esc(w)}</span>`));selectedKeywords.forEach(w=>out=out.replaceAll(esc(w),`<span class="picked">${esc(w)}</span>`));return out}function show(s){selectedStore=s;$('detailTitle').textContent=s.name||DATA.brand;$('detail').className='';if(s.error){$('detail').innerHTML=`<div class="empty"><span style="color:var(--red)">${esc(s.error)}</span></div>`;return}if(!s.checked){$('detail').innerHTML='<div class="empty">아직 리뷰 검사를 하지 않은 매장입니다.</div>';return}let reviews=(s.reviews||[]).filter(reviewHasKeyword);if(!reviews.length){$('detail').innerHTML=selectedKeywords.length?'<div class="empty">선택한 단어가 들어간 최근 리뷰가 없습니다.</div>':'<div class="empty">가져온 최근 리뷰가 없습니다.</div>';return}$('detail').innerHTML=reviews.map(r=>{let t=mark(r.text||'',r.bad_hits,'bad');(r.good_hits||[]).forEach(w=>t=t.replaceAll(esc(w),`<span class="good">${esc(w)}</span>`));const k=(r.score||0)>=20?'danger':(r.score||0)>=10?'warn':'normal';return`<div class="review">${badge(k)}<div class="reviewText">${t}</div><div class="sub">불만 ${(r.bad_hits||[]).join(', ')||'-'} · 친절/칭찬 ${(r.good_hits||[]).join(', ')||'-'} · ${esc(r.created_at||'')}</div></div>`}).join('')}async function search(){const brand=$('brand').value.trim();if(brand.length<2||running)return;running=true;DATA={brand,stores:[]};resetDetail();render();$('searchBtn').disabled=true;$('checkBtn').disabled=true;$('stopBtn').disabled=false;bar(12);$('status').textContent=brand+' 네이버플레이스 매장을 검색 중입니다.';log('매장 검색 시작 · '+brand);try{const d=await api('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand})});DATA={brand:d.brand,stores:(d.stores||[]).map(s=>({...s,checked:false,reviews:[],error:null}))};bar(100);$('status').textContent=`검색 완료 · ${DATA.stores.length}개 매장 발견`;log(`검색 완료 · ${DATA.stores.length}개`);$('checkBtn').disabled=!DATA.stores.length}catch(e){$('status').textContent='검색 오류 · '+e.message;log('검색 오류 · '+e.message)}running=false;$('searchBtn').disabled=false;$('stopBtn').disabled=true;render()}async function checkAll(){if(running||!DATA.stores.length)return;running=true;$('searchBtn').disabled=true;$('checkBtn').disabled=true;$('stopBtn').disabled=false;bar(0);log('최근 리뷰 10개 검사 시작');for(let i=0;i<DATA.stores.length&&running;i++){const s=DATA.stores[i];$('status').textContent=`${i+1}/${DATA.stores.length} · ${s.name} 리뷰 검사 중`;try{const d=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});DATA.stores[i]={...s,...d,checked:true,error:null};log(`${s.name} · 리뷰 ${DATA.stores[i].reviews.length}개`)}catch(e){DATA.stores[i]={...s,checked:false,reviews:[],error:e.message};log(`${s.name} · 오류 ${e.message}`)}bar((i+1)/DATA.stores.length*100);render();if(selectedStore&&selectedStore.place_id===DATA.stores[i].place_id)show(DATA.stores[i]);await new Promise(r=>setTimeout(r,80))}$('status').textContent=running?'리뷰 검사 완료':'검사를 중지했습니다.';running=false;$('searchBtn').disabled=false;$('checkBtn').disabled=false;$('stopBtn').disabled=true;render()}function exportRows(){return DATA.stores.map((s,i)=>{const c=counts(s);return {'번호':i+1,'브랜드':DATA.brand,'네이버플레이스 매장명':s.name||'','Place ID':s.place_id||'','주소':s.address||'','상태':label(statusOf(s)),'최근 리뷰 수':c.reviews,'불만 리뷰':c.bad,'칭찬 리뷰':c.good,'선택 검색 단어':selectedKeywords.join(', '),'오류':s.error||''}})}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportExcel(){const rows=exportRows();if(!rows.length){$('status').textContent='내보낼 매장이 없습니다.';return}const h=Object.keys(rows[0]);const cell=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const table='<table><tr>'+h.map(x=>`<th>${cell(x)}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+h.map(x=>`<td>${cell(r[x])}</td>`).join('')+'</tr>').join('')+'</table>';downloadBlob(new Blob(['\ufeff<html><meta charset="utf-8"><body>'+table+'</body></html>'],{type:'application/vnd.ms-excel;charset=utf-8'}),`${DATA.brand||'brand'}-리뷰관리.xls`)}function printReport(kind){if(!DATA.stores.length){$('status').textContent='출력할 데이터가 없습니다.';return}$('status').textContent=kind==='pdf'?'인쇄 창에서 PDF로 저장을 선택하세요.':'인쇄 창을 열었습니다.';setTimeout(()=>window.print(),50)}async function saveSchedule(){const body={enabled:$('enabled').value==='true',brand:$('brand').value.trim(),frequency:$('frequency').value,weekday:$('weekday').value,time:$('time').value};const d=await api('/api/schedule',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('status').textContent=d.schedule.enabled?'예약 저장 완료':'예약 검사를 껐습니다.';log('예약 저장')}async function runSchedule(){const brand=$('brand').value.trim();if(brand.length<2)return;$('status').textContent='예약검사를 즉시 실행 중입니다.';resetDetail();const d=await api('/api/schedule/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand})});DATA={brand:d.brand,stores:d.stores||[]};$('status').textContent=`예약검사 완료 · ${DATA.stores.length}개`;render()}async function loadSchedule(){try{const d=await api('/api/schedule');const s=d.schedule||{};$('enabled').value=String(!!s.enabled);$('frequency').value=s.frequency||'daily';$('weekday').value=s.weekday||'mon';$('time').value=s.time||'09:00';if(s.brand&&!$('brand').value)$('brand').value=s.brand}catch{}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('storesView').classList.toggle('hide',b.dataset.view!=='stores');$('praiseView').classList.toggle('hide',b.dataset.view!=='praise')});$('searchBtn').onclick=search;$('checkBtn').onclick=checkAll;$('stopBtn').onclick=()=>running=false;$('brand').onkeydown=e=>{if(e.key==='Enter')search()};$('storeFilter').oninput=render;$('sort').onchange=render;$('excelBtn').onclick=exportExcel;$('pdfBtn').onclick=()=>printReport('pdf');$('printBtn').onclick=()=>printReport('print');$('saveScheduleBtn').onclick=()=>saveSchedule().catch(e=>$('status').textContent=e.message);$('runScheduleBtn').onclick=()=>runSchedule().catch(e=>$('status').textContent=e.message);$('clearKeywordsBtn').onclick=()=>{selectedKeywords=[];renderKeywords();render();if(selectedStore)show(selectedStore)};$('addKeywordBtn').onclick=addKeyword;$('customKeyword').onkeydown=e=>{if(e.key==='Enter')addKeyword()};$('healthBtn').onclick=async()=>{try{const d=await api('/api/health');$('status').textContent=`엔진 정상 · v${d.version} · 최근 리뷰 ${d.review_limit}개 기준`;log('엔진 확인 v'+d.version)}catch(e){$('status').textContent='엔진 오류 · '+e.message}};renderKeywords();loadSchedule();render();
</script>
