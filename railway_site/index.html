<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브랜드 리뷰 모니터링</title><style>:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--text:#171717;--muted:#737373;--red:#b91c1c;--green:#166534;--amber:#92400e;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.head h1{margin:0;font-size:30px}.muted{color:var(--muted)}.searchbox,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.searchbox{margin:18px 0}.brandrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}.brandrow input,.toolbar input,.toolbar select{border:1px solid #d4d4d8;border-radius:11px;padding:13px;font-size:15px;background:#fff}.btn{border:0;border-radius:11px;padding:13px 17px;font-weight:800;cursor:pointer;background:#171717;color:#fff}.btn.blue{background:var(--blue)}.btn.alt{background:#fff;color:#171717;border:1px solid #d4d4d8}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:12px;padding:12px 14px;background:#fafafa;border-radius:12px}.progress{height:10px;background:#eceff3;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#171717;transition:width .25s ease}.phasegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.phase{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;background:#fff}.phase.active{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.phase.done{border-color:#86efac;background:#f0fdf4;color:#166534}.log{margin-top:10px;max-height:150px;overflow:auto;background:#111827;color:#d1d5db;border-radius:12px;padding:10px 12px;font:12px/1.55 monospace}.log div+div{margin-top:3px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:6px}.metric small{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1.2fr .7fr auto;gap:8px;margin-bottom:14px}.layout{display:grid;grid-template-columns:1fr 1.45fr;gap:14px}.stores{max-height:720px;overflow:auto}.store{padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.store:hover{background:#fafafa}.top{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.critical{background:#fee2e2;color:var(--red)}.warning{background:#fef3c7;color:var(--amber)}.good{background:#dcfce7;color:var(--green)}.failed{background:#f3f4f6;color:#52525b}.pending{background:#e0e7ff;color:#3730a3}.review{padding:15px 0;border-bottom:1px solid #eee;line-height:1.7}.bad{background:#fee2e2;color:var(--red);font-weight:800;padding:2px 4px;border-radius:4px}.goodword{background:#dcfce7;color:var(--green);font-weight:800;padding:2px 4px;border-radius:4px}.empty{text-align:center;color:var(--muted);padding:45px 12px}.error{color:var(--red)}@media(max-width:850px){.summary,.layout,.toolbar,.brandrow,.phasegrid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.wrap{padding:15px}}</style></head><body><div class="wrap"><div class="head"><div><h1><span id="brandTitle">브랜드</span> 리뷰 모니터링</h1><div class="muted" style="margin-top:6px">1. 전체 매장 수집 → 2. 최근 7일 리뷰 검사 → 3. 위험지점 우선관리</div></div><button class="btn alt" id="healthBtn">엔진 확인</button></div><div class="searchbox"><div class="brandrow"><input id="brand" placeholder="예: 은화수식당, 청년다방"><button class="btn blue" id="collectBtn">① 매장 수집</button><button class="btn" id="inspectBtn" disabled>② 리뷰 검사</button><button class="btn alt" id="stopBtn" disabled>중지</button></div><div id="status" class="status">브랜드명을 입력하고 먼저 매장을 수집하세요.</div><div class="progress"><i id="bar"></i></div><div class="phasegrid"><div class="phase" id="p1">① 지역별 매장 탐색</div><div class="phase" id="p2">② 중복 매장 제거</div><div class="phase" id="p3">③ 최근 7일 리뷰 검사</div></div><div id="log" class="log"><div>READY · 수집 대기</div></div></div><div class="summary"><div class="card metric"><span>전체 매장</span><b id="mStores">0</b><small>네이버 검색 수집 기준</small></div><div class="card metric"><span>검사 완료</span><b id="mOk">0</b><small id="rOk">0%</small></div><div class="card metric"><span>최근 7일 리뷰</span><b id="mReviews">0</b><small id="rFail">실패 0%</small></div><div class="card metric"><span>불량 리뷰</span><b id="mBad">0</b><small id="rBad">0%</small></div><div class="card metric"><span>집중관리</span><b id="mCritical">0</b><small id="rCritical">0%</small></div></div><div class="card toolbar"><input id="storeSearch" placeholder="매장명 또는 주소 검색"><select id="filter"><option value="all">전체 상태</option><option value="pending">미검사</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option><option value="failed">수집실패</option></select><span class="muted" style="align-self:center">위험도 높은 순</span></div><div class="layout"><div class="card"><b>매장 현황</b><div id="stores" class="stores"><div class="empty">아직 수집한 브랜드가 없습니다.</div></div></div><div class="card"><b id="detailTitle">리뷰 상세</b><div id="reviews" class="empty">리뷰 검사가 끝난 매장을 선택하면 표시됩니다.</div></div></div></div><script>let DATA={brand:'',stores:[]},running=false;const $=x=>document.getElementById(x),pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'0.0%',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function log(msg){const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('ko-KR')+' · '+msg;$('log').prepend(d)}function phase(id,state){['active','done'].forEach(c=>$(id).classList.remove(c));if(state)$(id).classList.add(state)}function setBar(v){$('bar').style.width=Math.max(0,Math.min(100,v))+'%'}function level(s){if(!s.checked&&!s.error)return'pending';if(s.error)return'failed';if(!s.reviews?.length)return'good';const max=Math.max(...s.reviews.map(r=>r.score||0));return max>=20?'critical':max>=10?'warning':'good'}function label(l){return{critical:'집중관리',warning:'주의',good:'정상',failed:'검사실패',pending:'미검사'}[l]}function badge(l){return`<span class="pill ${l}">${label(l)}</span>`}function stats(s){return{level:level(s),bad:(s.reviews||[]).filter(r=>(r.bad_hits||[]).length).length}}async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`HTTP ${r.status}`);return d}function render(){const rows=DATA.stores.map((s,i)=>({s,i,st:stats(s)}));const q=$('storeSearch').value.trim(),f=$('filter').value,rank={critical:5,warning:4,failed:3,pending:2,good:1};const list=rows.filter(x=>(!q||(x.s.name+x.s.address).includes(q))&&(f==='all'||x.st.level===f)).sort((a,b)=>rank[b.st.level]-rank[a.st.level]||b.st.bad-a.st.bad||a.s.name.localeCompare(b.s.name));const total=rows.length,ok=rows.filter(x=>x.s.checked&&!x.s.error).length,fail=rows.filter(x=>x.s.error).length,reviews=rows.reduce((n,x)=>n+(x.s.reviews?.length||0),0),bad=rows.reduce((n,x)=>n+x.st.bad,0),critical=rows.filter(x=>x.st.level==='critical').length;$('brandTitle').textContent=DATA.brand||'브랜드';$('mStores').textContent=total;$('mOk').textContent=ok;$('mReviews').textContent=reviews;$('mBad').textContent=bad;$('mCritical').textContent=critical;$('rOk').textContent='검사완료율 '+pct(ok,total);$('rFail').textContent='검사실패율 '+pct(fail,total);$('rBad').textContent='불량리뷰율 '+pct(bad,reviews);$('rCritical').textContent='집중관리율 '+pct(critical,total);$('stores').innerHTML=list.length?list.map(x=>`<div class="store" data-i="${x.i}"><div class="top"><b>${esc(x.s.name)}</b>${badge(x.st.level)}</div><div class="muted">${esc(x.s.address||'')} · ID ${esc(x.s.place_id||'-')}</div><div class="muted">리뷰 ${x.s.reviews?.length||0} · 불량 ${x.st.bad}${x.s.error?' · '+esc(x.s.error):''}</div></div>`).join(''):'<div class="empty">표시할 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(DATA.stores[+e.dataset.i]))}function show(s){$('detailTitle').textContent=s.name+' · 최근 7일';if(!s.checked){$('reviews').innerHTML='<div class="empty">아직 리뷰 검사를 하지 않은 매장입니다.</div>';return}if(!s.reviews?.length){$('reviews').innerHTML=`<div class="empty">${s.error?`<span class="error">${esc(s.error)}</span><br><br>`:''}최근 7일 리뷰가 없습니다.</div>`;return}$('reviews').innerHTML=s.reviews.map(r=>{let t=esc(r.text);(r.bad_hits||[]).forEach(w=>t=t.replaceAll(esc(w),`<span class="bad">${esc(w)}</span>`));(r.good_hits||[]).forEach(w=>t=t.replaceAll(esc(w),`<span class="goodword">${esc(w)}</span>`));const l=(r.score||0)>=20?'critical':(r.score||0)>=10?'warning':'good';return`<div class="review">${badge(l)}<div style="margin-top:8px">${t}</div><div class="muted">불량 ${(r.bad_hits||[]).join(', ')||'-'} · 좋은 ${(r.good_hits||[]).join(', ')||'-'} · ${esc(r.created_at||'')}</div></div>`}).join('')}async function collect(){const brand=$('brand').value.trim();if(brand.length<2||running)return;running=true;$('collectBtn').disabled=true;$('inspectBtn').disabled=true;$('stopBtn').disabled=false;DATA={brand,stores:[]};render();phase('p1','active');phase('p2',null);phase('p3',null);setBar(0);$('status').textContent=`${brand} · 전국 지역별 매장 수집 시작`;log(`${brand} 수집 시작`);try{const plan=await api('/api/search-plan');const seen=new Map();for(let i=0;i<plan.areas.length&&running;i++){const area=plan.areas[i];$('status').textContent=`${brand} · ${i+1}/${plan.areas.length} ${area} 검색 중 · 현재 ${seen.size}개`;setBar((i/plan.areas.length)*85);try{const d=await api('/api/search-area',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand,area})});let added=0;(d.stores||[]).forEach(s=>{if(!seen.has(s.place_id)){seen.set(s.place_id,{...s,reviews:[],error:null,checked:false});added++}});if(added)log(`${area} · +${added}개 · 누적 ${seen.size}개`)}catch(e){log(`${area} · 검색 오류 ${e.message}`)}if(i%3===0){DATA.stores=[...seen.values()];render()}}DATA.stores=[...seen.values()];render();phase('p1','done');phase('p2','active');$('status').textContent=`${brand} · 중복 제거 및 목록 정리 중`;setBar(92);await new Promise(r=>setTimeout(r,250));phase('p2','done');setBar(100);$('status').textContent=`${brand} 매장 수집 완료 · ${DATA.stores.length}개 발견`;log(`수집 완료 · 중복 제거 후 ${DATA.stores.length}개`);$('inspectBtn').disabled=DATA.stores.length===0}catch(e){$('status').innerHTML=`<span class="error">수집 실패 · ${esc(e.message)}</span>`;log(`수집 실패 · ${e.message}`)}finally{running=false;$('collectBtn').disabled=false;$('stopBtn').disabled=true}}async function inspect(){if(running||!DATA.stores.length)return;running=true;$('collectBtn').disabled=true;$('inspectBtn').disabled=true;$('stopBtn').disabled=false;phase('p3','active');setBar(0);let ok=0,fail=0;log(`리뷰 검사 시작 · ${DATA.stores.length}개 매장`);for(let i=0;i<DATA.stores.length&&running;i++){const s=DATA.stores[i];$('status').textContent=`${DATA.brand} · ${i+1}/${DATA.stores.length} ${s.name} 리뷰 검사 · 성공 ${ok} · 실패 ${fail}`;setBar(((i+1)/DATA.stores.length)*100);try{const x=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,address:s.address,place_id:s.place_id,place_type:s.place_type,days:7})});s.reviews=x.reviews||[];s.checked=true;s.error=null;ok++;log(`${s.name} · 완료 · 최근7일 ${s.reviews.length}건`)}catch(e){s.error=e.message;s.checked=false;fail++;log(`${s.name} · 실패 · ${e.message}`)}render()}phase('p3',running?'done':null);$('status').textContent=running?`${DATA.brand} 리뷰 검사 완료 · 성공 ${ok} · 실패 ${fail}`:`${DATA.brand} 검사를 중지했습니다.`;log(`리뷰 검사 종료 · 성공 ${ok} · 실패 ${fail}`);running=false;$('collectBtn').disabled=false;$('inspectBtn').disabled=false;$('stopBtn').disabled=true}$('collectBtn').onclick=collect;$('inspectBtn').onclick=inspect;$('stopBtn').onclick=()=>running=false;$('brand').onkeydown=e=>{if(e.key==='Enter')collect()};$('storeSearch').oninput=render;$('filter').onchange=render;$('healthBtn').onclick=async()=>{try{const d=await api('/api/health');$('status').textContent=`엔진 정상 · ${d.service} v${d.version}`;log(`엔진 확인 · v${d.version}`)}catch(e){$('status').textContent='엔진 오류 · '+e.message}};</script></body></html>
