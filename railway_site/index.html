<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브랜드 리뷰 모니터링</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,"Noto Sans KR",sans-serif;color:#171717}.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:0 0 6px;font-size:30px}.muted{color:#737373}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}.row input{padding:14px;border:1px solid #d4d4d8;border-radius:11px;font-size:16px}.btn{padding:14px 18px;border:0;border-radius:11px;background:#171717;color:white;font-weight:800}.blue{background:#1d4ed8}.alt{background:#fff;color:#171717;border:1px solid #d4d4d8}.btn:disabled{opacity:.4}.status{margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;width:0;height:100%;background:#171717;transition:.2s}.log{max-height:145px;overflow:auto;margin-top:10px;background:#111827;color:#d1d5db;border-radius:11px;padding:10px;font:12px/1.55 monospace}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{display:block;font-size:28px;margin-top:5px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stores{max-height:700px;overflow:auto}.store,.rank{padding:12px 0;border-bottom:1px solid #eee}.store b{font-size:15px}.idline{font-size:12px;color:#737373;margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e0e7ff;color:#3730a3}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#b91c1c}.rank{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px}.rankno{font-size:20px;font-weight:900}.praise{font-weight:900;color:#166534}.review{padding:12px 0;border-bottom:1px solid #eee;line-height:1.6}.empty{padding:35px;text-align:center;color:#737373}@media(max-width:800px){.row,.metrics,.layout{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1><span id="title">브랜드</span> 리뷰 모니터링</h1><div class="muted">네이버 지도 기준 매장 최대수집 → 최근 7일 리뷰 검사 → 칭찬 TOP 10</div><div class="card" style="margin-top:16px"><div class="row"><input id="brand" placeholder="예: 은화수식당"><button class="btn blue" id="collect">① 매장 수집</button><button class="btn" id="check" disabled>② 리뷰 검사</button><button class="btn alt" id="stop" disabled>중지</button></div><div class="status" id="status">브랜드명을 입력하세요.</div><div class="bar"><i id="bar"></i></div><div class="log" id="log"><div>READY</div></div></div><div class="metrics"><div class="card metric">전체 매장<b id="total">0</b><small class="muted">Place ID 중복제거</small></div><div class="card metric">검사 완료<b id="done">0</b></div><div class="card metric">최근 7일 리뷰<b id="reviewsN">0</b></div><div class="card metric">칭찬 리뷰<b id="goodN">0</b></div></div><div class="card"><h3 style="margin-top:0">🏆 칭찬 많은 매장 TOP 10</h3><div class="muted" style="margin-bottom:8px">최근 7일 리뷰에서 칭찬 키워드가 포함된 리뷰 수 기준</div><div id="top10" class="empty">리뷰 검사가 끝나면 자동 표시됩니다.</div></div><div class="layout"><div class="card"><h3 style="margin-top:0">매장 목록</h3><div class="muted" style="margin-bottom:8px">ID 옆에 실제 검색된 매장명을 함께 표시합니다.</div><div id="stores" class="stores"><div class="empty">수집 전</div></div></div><div class="card"><h3 id="detail" style="margin-top:0">리뷰 상세</h3><div id="reviewList" class="empty">매장을 선택하세요.</div></div></div></div><script>let D={brand:'',stores:[]},run=false;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function lg(x){let d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('ko-KR')+' · '+x;$('log').prepend(d)}function prog(x){$('bar').style.width=x+'%'}async function api(u,o){let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||r.status);return d}function goodCount(s){return(s.reviews||[]).filter(r=>(r.good_hits||[]).length>0).length}function render(){let total=D.stores.length,done=D.stores.filter(s=>s.checked).length,rn=D.stores.reduce((n,s)=>n+(s.reviews||[]).length,0),gn=D.stores.reduce((n,s)=>n+goodCount(s),0);$('title').textContent=D.brand||'브랜드';$('total').textContent=total;$('done').textContent=done;$('reviewsN').textContent=rn;$('goodN').textContent=gn;$('stores').innerHTML=total?D.stores.map((s,i)=>`<div class="store" data-i="${i}"><b>${esc(s.name||D.brand)}</b><div class="idline">ID ${esc(s.place_id)} · ${esc(s.name||D.brand)}</div><div class="idline">${esc(s.address||'주소 정보 없음')} · 리뷰 ${(s.reviews||[]).length} · 칭찬 ${goodCount(s)}</div></div>`).join(''):'<div class="empty">수집된 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(D.stores[+e.dataset.i]));let rank=D.stores.filter(s=>s.checked).map(s=>({s,g:goodCount(s),r:(s.reviews||[]).length})).sort((a,b)=>b.g-a.g||b.r-a.r).slice(0,10);$('top10').innerHTML=rank.length?rank.map((x,i)=>`<div class="rank"><div class="rankno">${i+1}</div><div><b>${esc(x.s.name)}</b><div class="idline">ID ${esc(x.s.place_id)} · ${esc(x.s.address||'')}</div></div><div class="praise">칭찬 ${x.g}</div></div>`).join(''):'<div class="empty">리뷰 검사가 끝나면 자동 표시됩니다.</div>'}function show(s){$('detail').textContent=s.name+' · 최근 7일';$('reviewList').innerHTML=(s.reviews||[]).length?(s.reviews||[]).map(r=>`<div class="review"><span class="pill ${(r.good_hits||[]).length?'good':(r.bad_hits||[]).length?'bad':''}">${(r.good_hits||[]).length?'칭찬':(r.bad_hits||[]).length?'불만':'일반'}</span> ${esc(r.text)}<div class="idline">칭찬 ${(r.good_hits||[]).join(', ')||'-'} · 불만 ${(r.bad_hits||[]).join(', ')||'-'} · ${esc(r.created_at||'')}</div></div>`).join(''):'<div class="empty">최근 7일 리뷰가 없습니다.</div>'}async function collect(){let brand=$('brand').value.trim();if(brand.length<2||run)return;run=true;$('collect').disabled=true;$('check').disabled=true;$('stop').disabled=false;D={brand,stores:[]};render();let seen=new Map();try{let p=await api('/api/search-plan');lg(`전국 ${p.count}개 지역 탐색 시작`);for(let i=0;i<p.areas.length&&run;i++){let area=p.areas[i];$('status').textContent=`${i+1}/${p.count} ${area} 검색 · 현재 ${seen.size}개`;prog(Math.round((i/p.count)*100));try{let x=await api('/api/search-area',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand,area})});let add=0;(x.stores||[]).forEach(s=>{if(s.place_id&&!seen.has(s.place_id)){seen.set(s.place_id,{...s,checked:false,reviews:[]});add++}});if(add)lg(`${area} +${add} · 누적 ${seen.size}`)}catch(e){lg(`${area} 오류 ${e.message}`)}if(i%4===0){D.stores=[...seen.values()];render()}}D.stores=[...seen.values()].sort((a,b)=>(a.name||'').localeCompare(b.name||''));render();prog(100);$('status').textContent=`수집 완료 · 중복 제거 후 ${D.stores.length}개`;lg(`최종 ${D.stores.length}개 Place ID 확보`);$('check').disabled=!D.stores.length}catch(e){$('status').textContent='수집 실패 · '+e.message}finally{run=false;$('collect').disabled=false;$('stop').disabled=true}}async function check(){if(run||!D.stores.length)return;run=true;$('collect').disabled=true;$('check').disabled=true;$('stop').disabled=false;let ok=0;for(let i=0;i<D.stores.length&&run;i++){let s=D.stores[i];$('status').textContent=`${i+1}/${D.stores.length} ${s.name} 리뷰 검사 · 완료 ${ok}`;prog(Math.round(((i+1)/D.stores.length)*100));try{let x=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,address:s.address,place_id:s.place_id,place_type:s.place_type,days:7})});s.reviews=x.reviews||[];s.checked=true;s.error=null;ok++;lg(`${s.name} 리뷰 ${s.reviews.length} · 칭찬 ${goodCount(s)}`)}catch(e){s.error=e.message;lg(`${s.name} 실패`)}render()}$('status').textContent=`리뷰 검사 종료 · ${ok}/${D.stores.length} 완료`;run=false;$('collect').disabled=false;$('check').disabled=false;$('stop').disabled=true} $('collect').onclick=collect;$('check').onclick=check;$('stop').onclick=()=>{run=false;$('status').textContent='중지 요청됨'};$('brand').addEventListener('keydown',e=>{if(e.key==='Enter')collect()});render();</script></body></html>
