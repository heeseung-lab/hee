<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청년다방 리뷰 모니터링</title><style>:root{--bg:#f5f6f8;--card:#fff;--line:#e3e5e8;--text:#17171a;--muted:#73757d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1420px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted)}.sub{margin-top:7px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#17171a;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#fff;color:#17171a;border:1px solid var(--line)}.progress{display:none;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.bar{height:9px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#17171a;transition:.2s}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 3px 12px #00000008}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:7px}.toolbar{display:grid;grid-template-columns:1.3fr .7fr auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{padding:13px;border:1px solid #d7d9de;border-radius:11px;background:#fff}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.stores{max-height:720px;overflow:auto}.store{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.store:hover{background:#fafafa}.top{display:flex;justify-content:space-between;gap:8px}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}.critical{background:#fee2e2;color:#b91c1c}.warning{background:#fef3c7;color:#92400e}.good{background:#dcfce7;color:#166534}.pending{background:#e5e7eb;color:#4b5563}.error{color:#b91c1c}.review{padding:15px 0;border-bottom:1px solid #eee;line-height:1.7}.bad{background:#fee2e2;color:#b91c1c;font-weight:800;padding:2px 4px;border-radius:4px}.positive{background:#dcfce7;color:#166534;font-weight:800;padding:2px 4px;border-radius:4px}.empty{text-align:center;color:var(--muted);padding:45px 12px}.engine{margin-top:8px;font-size:12px}.okdot{color:#166534}.baddot{color:#b91c1c}@media(max-width:850px){.summary,.layout,.toolbar{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.wrap{padding:16px}.actions{width:100%}.actions button{flex:1}}</style></head><body><div class="wrap"><div class="head"><div><h1>청년다방 리뷰 모니터링</h1><div class="sub">전체 매장 · 네이버플레이스 최신 리뷰 · 불량언어 자동체크 · 위험지점 우선관리</div><div id="scan" class="muted" style="margin-top:7px">실행엔진 확인 중…</div><div id="engine" class="engine muted"></div></div><div class="actions"><button class="btn" id="start">▶ 지금 전체 수집 시작</button><button class="btn secondary" id="stop" disabled>■ 중지</button><button class="btn secondary" id="reload">↻ 매장 다시 불러오기</button></div></div><div class="progress" id="progress"><b id="progressText">수집 준비 중</b><div class="bar"><i id="bar"></i></div><div class="muted" id="current" style="margin-top:8px"></div></div><div class="summary"><div class="card metric"><span>전체 매장</span><b id="mStores">0</b></div><div class="card metric"><span>수집 완료</span><b id="mOk">0</b></div><div class="card metric"><span>최신 리뷰</span><b id="mReviews">0</b></div><div class="card metric"><span>불량 리뷰</span><b id="mBad">0</b></div><div class="card metric"><span>집중관리</span><b id="mCritical">0</b></div></div><div class="card toolbar"><input id="search" placeholder="매장명 또는 주소 검색"><select id="filter"><option value="all">전체 상태</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option><option value="pending">미수집</option></select><span class="muted" style="align-self:center">위험도 높은 순</span></div><div class="layout"><div class="card"><b>전체 매장 / 위험 우선순위</b><div id="stores" class="stores"><div class="empty">매장 목록을 불러오는 중…</div></div></div><div class="card"><b id="title">매장을 선택하세요</b><div id="reviews" class="empty">왼쪽 매장을 누르면 최신 리뷰가 표시됩니다.</div></div></div></div><script>
const API='https://youngdabang-review-live-heeseung-1664s-projects.vercel.app';const PROXY='https://api.allorigins.win';const BAD=['불친절','맛없','별로','최악','위생','더럽','머리카락','늦','오래 걸','짜증','불쾌','실망','비싸','재방문 안'];const GOOD=['친절','맛있','추천','깨끗','만족','좋아요','재방문','최고'];let DATA={stores:[]},running=false,selected=null,engineMode='checking';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function analyze(t){const bad=BAD.filter(w=>t.includes(w));let good=GOOD.filter(w=>t.includes(w));if(t.includes('불친절')||t.includes('친절하지'))good=good.filter(w=>w!=='친절');const score=Math.max(0,bad.length*10-good.length*2);return{bad,good,score,level:score>=20?'critical':score>=10?'warning':'good'}}function stats(s){if(!s.reviews?.length)return{bad:0,max:0,level:'pending'};const a=s.reviews.map(r=>analyze(r.text||'')),max=Math.max(...a.map(x=>x.score));return{bad:a.filter(x=>x.bad.length).length,max,level:max>=20?'critical':max>=10?'warning':'good'}}function badge(l){return`<span class="pill ${l}">${{critical:'집중관리',warning:'주의',good:'정상',pending:'미수집'}[l]}</span>`}function save(){localStorage.setItem('yd-live-data',JSON.stringify(DATA))}
function render(){const q=$('search').value.trim(),f=$('filter').value;const idx=DATA.stores.map((s,i)=>({s,i,st:stats(s)})),rank={critical:4,warning:3,good:2,pending:1},list=idx.filter(x=>(!q||(x.s.name+x.s.address).includes(q))&&(f==='all'||x.st.level===f)).sort((a,b)=>rank[b.st.level]-rank[a.st.level]||b.st.max-a.st.max||a.s.name.localeCompare(b.s.name));$('mStores').textContent=DATA.stores.length;$('mOk').textContent=idx.filter(x=>x.st.level!=='pending').length;$('mReviews').textContent=DATA.stores.reduce((n,s)=>n+(s.reviews?.length||0),0);$('mBad').textContent=idx.reduce((n,x)=>n+x.st.bad,0);$('mCritical').textContent=idx.filter(x=>x.st.level==='critical').length;$('stores').innerHTML=list.length?list.map(x=>`<div class="store" data-i="${x.i}"><div class="top"><b>${esc(x.s.name)}</b>${badge(x.st.level)}</div><div class="muted">${esc(x.s.address||'')}</div><div class="muted" style="margin-top:5px">리뷰 ${x.s.reviews?.length||0} · 불량 ${x.st.bad}${x.s.error?' · 수집오류':''}</div></div>`).join(''):'<div class="empty">표시할 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(DATA.stores[+e.dataset.i]))}
function show(s){selected=s;$('title').textContent=s.name+' · 최신 리뷰';if(!s.reviews?.length){$('reviews').innerHTML=`<div class="empty">${s.error?`<span class="error">${esc(s.error)}</span><br><br>`:''}아직 수집된 리뷰가 없습니다.</div>`;return}$('reviews').innerHTML=s.reviews.map(r=>{const a=analyze(r.text||'');let t=esc(r.text);[...a.bad].sort((a,b)=>b.length-a.length).forEach(w=>t=t.replaceAll(esc(w),`<span class="bad">${esc(w)}</span>`));[...a.good].sort((a,b)=>b.length-a.length).forEach(w=>t=t.replaceAll(esc(w),`<span class="positive">${esc(w)}</span>`));return`<div class="review">${badge(a.level)} ${r.rating?`<b>★ ${r.rating}</b>`:''}<div style="margin-top:8px">${t}</div><div class="muted">불량 ${esc(a.bad.join(', ')||'-')} · 좋은 ${esc(a.good.join(', ')||'-')} · ${esc(r.created_at||'')}</div></div>`}).join('')}
async function proxyText(url){const r=await fetch(PROXY+'/get?url='+encodeURIComponent(url),{cache:'no-store'});if(!r.ok)throw Error('중계 HTTP '+r.status);const d=await r.json();if(!d.contents)throw Error('중계 응답 없음');return d.contents}
function parseStoresHtml(html){const doc=new DOMParser().parseFromString(html,'text/html');const lines=(doc.body.innerText||doc.body.textContent||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);const phone=/^(?:0\d{1,2})[)\-]?\s*\d{3,4}-\d{4}$/;const regions=/^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/;const out=[];for(let i=2;i<lines.length;i++){if(!phone.test(lines[i]))continue;let address=lines[i-1],name=lines[i-2];if(!regions.test(address))continue;if(/^\d+$/.test(name)||name.length>50)continue;out.push({name,address})}return out}
async function fallbackStores(){let out=[],seen=new Set(),empty=0;for(let p=1;p<=35;p++){const html=await proxyText(`https://www.youngdabang.com/board/index.php?board=map_01&page=${p}&sca=all&type=list`);const rows=parseStoresHtml(html);let n=0;for(const s of rows){const k=s.name+'|'+s.address;if(!seen.has(k)){seen.add(k);out.push(s);n++}}if(p>2&&n===0){empty++;if(empty>=2)break}else empty=0;$('scan').textContent=`공식 매장목록 불러오는 중 · ${out.length}개`;await sleep(100)}if(!out.length)throw Error('공식 매장목록을 읽지 못했습니다');return out}
function extractPlace(html){let m=html.match(/m\.place\.naver\.com\/(restaurant|place|cafe)\/([0-9]{5,})/i)||html.match(/(?:pcmap\.)?place\.naver\.com\/(restaurant|place|cafe)\/([0-9]{5,})/i);if(m)return{type:m[1].toLowerCase(),id:m[2]};m=html.match(/map\.naver\.com\/(?:p\/)?entry\/place\/([0-9]{5,})/i)||html.match(/(?:placeId|entryId)[=\"':]+([0-9]{5,})/i);return m?{type:'restaurant',id:m[1]}:null}
function balancedJson(text,marker){const idx=text.indexOf(marker);if(idx<0)return null;let start=text.indexOf('{',idx),depth=0,str=false,escp=false;for(let i=start;i>=0&&i<text.length;i++){const c=text[i];if(str){if(escp)escp=false;else if(c==='\\')escp=true;else if(c==='"')str=false;continue}if(c==='"'){str=true;continue}if(c==='{')depth++;if(c==='}'){depth--;if(depth===0){try{return JSON.parse(text.slice(start,i+1))}catch{return null}}}}return null}
function walkReviews(obj,path='root',out=[]){if(Array.isArray(obj)){obj.forEach((x,i)=>walkReviews(x,path+'['+i+']',out));return out}if(!obj||typeof obj!=='object')return out;const hint=(path+' '+Object.keys(obj).join(' ')).toLowerCase();const text=['body','reviewBody','content','comment','reviewText'].map(k=>obj[k]).find(v=>typeof v==='string'&&v.trim().length>1);if(text&&hint.includes('review')&&('id'in obj||'reviewId'in obj||'created'in obj||'createdAt'in obj||'rating'in obj)){out.push({id:String(obj.reviewId||obj.id||Math.random()),text:text.replace(/\s+/g,' ').trim(),created_at:obj.createdAt||obj.created||obj.visitDate||null,rating:obj.rating||obj.starRating||null})}Object.entries(obj).forEach(([k,v])=>walkReviews(v,path+'.'+k,out));return out}
async function fallbackCheck(s){const search=await proxyText('https://search.naver.com/search.naver?query='+encodeURIComponent('청년다방 '+s.name+' '+s.address));const p=extractPlace(search);if(!p)throw Error('네이버 플레이스를 찾지 못했습니다');for(const type of [...new Set([p.type,'restaurant','place'])]){const url=`https://m.place.naver.com/${type}/${p.id}/review/visitor?reviewSort=recent`;try{const html=await proxyText(url);const state=balancedJson(html,'window.__APOLLO_STATE__')||balancedJson(html,'__APOLLO_STATE__');if(state){const reviews=walkReviews(state).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,20);if(reviews.length)return{ok:true,place_id:p.id,review_url:url,reviews}}}catch{}}throw Error('플레이스는 찾았지만 공개 리뷰 본문을 읽지 못했습니다')}
async function engineCheck(){try{const c=new AbortController();setTimeout(()=>c.abort(),5000);const r=await fetch(API+'/api/ping',{signal:c.signal,cache:'no-store'});const d=await r.json();if(r.ok&&d.ok){engineMode='vercel';$('engine').innerHTML='<span class="okdot">● 실행엔진 연결됨</span> · Vercel';return true}}catch{}engineMode='proxy';$('engine').innerHTML='<span class="okdot">● 직접수집 모드</span> · 무료 공개 중계 사용';return false}
async function loadStores(force=false){if(force){DATA={stores:[]};localStorage.removeItem('yd-live-data')}if(!force){const cached=localStorage.getItem('yd-live-data');if(cached){try{DATA=JSON.parse(cached);if(DATA.stores?.length){render();$('scan').textContent=`저장된 매장 ${DATA.stores.length}개 준비`;return}}catch{}}}try{$('scan').textContent='공식 매장 목록 불러오는 중…';let stores=[];if(engineMode==='vercel'){try{const r=await fetch(API+'/api/stores',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'매장목록 실패');stores=d.stores||[]}catch{engineMode='proxy';$('engine').innerHTML='<span class="okdot">● 직접수집 모드</span> · 실행엔진 자동 폴백'}}if(!stores.length)stores=await fallbackStores();DATA={stores};save();render();$('scan').textContent=`매장 ${DATA.stores.length}개 준비 · 지금 전체 수집 시작을 누르세요`;}catch(e){$('scan').innerHTML=`<span class="error">매장목록 실패 · ${esc(e.message)}</span>`}}
async function checkStore(s){if(engineMode==='vercel'){try{const r=await fetch(API+'/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,address:s.address})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'수집 실패');return d}catch{engineMode='proxy';$('engine').innerHTML='<span class="okdot">● 직접수집 모드</span> · 실행엔진 자동 폴백'}}return fallbackCheck(s)}
async function start(){if(running)return;if(!DATA.stores.length)await loadStores(true);if(!DATA.stores.length)return;running=true;$('start').disabled=true;$('stop').disabled=false;$('progress').style.display='block';let done=0,ok=0,fail=0;for(let i=0;i<DATA.stores.length&&running;i++){const s=DATA.stores[i];$('current').textContent=`현재: ${s.name}`;$('progressText').textContent=`${i+1} / ${DATA.stores.length} 매장 검사 중 · 성공 ${ok} · 실패 ${fail}`;$('bar').style.width=(i/DATA.stores.length*100)+'%';try{const d=await checkStore(s);s.reviews=d.reviews||[];s.place_id=d.place_id;s.review_url=d.review_url;s.error=null;s.checked_at=new Date().toISOString();ok++}catch(e){s.error=e.message;fail++}done++;save();render();if(selected===s)show(s);await sleep(180)}running=false;$('bar').style.width='100%';$('progressText').textContent=`수집 종료 · ${done}개 검사 · 성공 ${ok} · 실패 ${fail}`;$('current').textContent='완료 시각 '+new Date().toLocaleString('ko-KR');$('scan').textContent=`최근 직접 검사 ${new Date().toLocaleString('ko-KR')} · 성공 ${ok} · 실패 ${fail}`;$('start').disabled=false;$('stop').disabled=true}
function stop(){running=false;$('current').textContent='사용자가 수집을 중지했습니다.'}$('start').onclick=start;$('stop').onclick=stop;$('reload').onclick=()=>loadStores(true);$('search').oninput=render;$('filter').onchange=render;(async()=>{await engineCheck();await loadStores(false)})();
</script></body></html>
