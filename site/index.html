<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청년다방 리뷰 모니터링</title><style>:root{--bg:#f5f6f8;--card:#fff;--line:#e3e5e8;--text:#17171a;--muted:#73757d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1420px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted)}.sub{margin-top:7px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#17171a;color:#fff}.btn:disabled{opacity:.45}.secondary{background:#fff;color:#17171a;border:1px solid var(--line)}.progress{display:none;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.bar{height:9px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#17171a}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:7px}.toolbar{display:grid;grid-template-columns:1.3fr .7fr auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{padding:13px;border:1px solid #d7d9de;border-radius:11px;background:#fff}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.stores{max-height:720px;overflow:auto}.store{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.top{display:flex;justify-content:space-between;gap:8px}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}.critical{background:#fee2e2;color:#b91c1c}.warning{background:#fef3c7;color:#92400e}.good{background:#dcfce7;color:#166534}.pending{background:#e5e7eb;color:#4b5563}.error{color:#b91c1c}.review{padding:15px 0;border-bottom:1px solid #eee;line-height:1.7}.bad{background:#fee2e2;color:#b91c1c;font-weight:800;padding:2px 4px;border-radius:4px}.positive{background:#dcfce7;color:#166534;font-weight:800;padding:2px 4px;border-radius:4px}.empty{text-align:center;color:var(--muted);padding:45px 12px}.engine{margin-top:8px;font-size:12px}@media(max-width:850px){.summary,.layout,.toolbar{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="head"><div><h1>청년다방 리뷰 모니터링</h1><div class="sub">전체 매장 · 네이버플레이스 최신 리뷰 · 불량언어 자동체크 · 위험지점 우선관리</div><div id="scan" class="muted" style="margin-top:7px">실행엔진 확인 중…</div><div id="engine" class="engine muted"></div></div><div class="actions"><button class="btn" id="start">▶ 지금 전체 수집 시작</button><button class="btn secondary" id="stop" disabled>■ 중지</button><button class="btn secondary" id="reload">↻ 매장 다시 불러오기</button></div></div><div class="progress" id="progress"><b id="progressText">수집 준비 중</b><div class="bar"><i id="bar"></i></div><div class="muted" id="current" style="margin-top:8px"></div></div><div class="summary"><div class="card metric"><span>전체 매장</span><b id="mStores">0</b></div><div class="card metric"><span>수집 완료</span><b id="mOk">0</b></div><div class="card metric"><span>최신 리뷰</span><b id="mReviews">0</b></div><div class="card metric"><span>불량 리뷰</span><b id="mBad">0</b></div><div class="card metric"><span>집중관리</span><b id="mCritical">0</b></div></div><div class="card toolbar"><input id="search" placeholder="매장명 또는 주소 검색"><select id="filter"><option value="all">전체 상태</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option><option value="pending">미수집</option></select><span class="muted" style="align-self:center">위험도 높은 순</span></div><div class="layout"><div class="card"><b>전체 매장 / 위험 우선순위</b><div id="stores" class="stores"><div class="empty">매장 목록을 불러오는 중…</div></div></div><div class="card"><b id="title">매장을 선택하세요</b><div id="reviews" class="empty">왼쪽 매장을 누르면 최신 리뷰가 표시됩니다.</div></div></div></div><script>
const API='https://youngdabang-review-live.vercel.app';const BAD=['불친절','맛없','별로','최악','위생','더럽','머리카락','늦','오래 걸','짜증','불쾌','실망','비싸','재방문 안'];const GOOD=['친절','맛있','추천','깨끗','만족','좋아요','재방문','최고'];let DATA={stores:[]},running=false;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function analyze(t){const bad=BAD.filter(w=>t.includes(w));let good=GOOD.filter(w=>t.includes(w));if(t.includes('불친절')||t.includes('친절하지'))good=good.filter(w=>w!=='친절');const score=Math.max(0,bad.length*10-good.length*2);return{bad,good,score,level:score>=20?'critical':score>=10?'warning':'good'}}function stats(s){if(!s.reviews?.length)return{bad:0,max:0,level:'pending'};const a=s.reviews.map(r=>analyze(r.text||'')),max=Math.max(...a.map(x=>x.score));return{bad:a.filter(x=>x.bad.length).length,max,level:max>=20?'critical':max>=10?'warning':'good'}}function badge(l){return`<span class="pill ${l}">${{critical:'집중관리',warning:'주의',good:'정상',pending:'미수집'}[l]}</span>`}function save(){localStorage.setItem('yd-live-data',JSON.stringify(DATA))}
function render(){const q=$('search').value.trim(),f=$('filter').value,rank={critical:4,warning:3,good:2,pending:1};const idx=DATA.stores.map((s,i)=>({s,i,st:stats(s)}));const list=idx.filter(x=>(!q||(x.s.name+x.s.address).includes(q))&&(f==='all'||x.st.level===f)).sort((a,b)=>rank[b.st.level]-rank[a.st.level]||b.st.max-a.st.max||a.s.name.localeCompare(b.s.name));$('mStores').textContent=DATA.stores.length;$('mOk').textContent=idx.filter(x=>x.st.level!=='pending').length;$('mReviews').textContent=DATA.stores.reduce((n,s)=>n+(s.reviews?.length||0),0);$('mBad').textContent=idx.reduce((n,x)=>n+x.st.bad,0);$('mCritical').textContent=idx.filter(x=>x.st.level==='critical').length;$('stores').innerHTML=list.length?list.map(x=>`<div class="store" data-i="${x.i}"><div class="top"><b>${esc(x.s.name)}</b>${badge(x.st.level)}</div><div class="muted">${esc(x.s.address||'')}</div><div class="muted">리뷰 ${x.s.reviews?.length||0} · 불량 ${x.st.bad}${x.s.error?' · 수집오류':''}</div></div>`).join(''):'<div class="empty">표시할 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(e=>e.onclick=()=>show(DATA.stores[+e.dataset.i]))}
function show(s){$('title').textContent=s.name+' · 최신 리뷰';if(!s.reviews?.length){$('reviews').innerHTML=`<div class="empty">${s.error?`<span class="error">${esc(s.error)}</span><br><br>`:''}아직 수집된 리뷰가 없습니다.</div>`;return}$('reviews').innerHTML=s.reviews.map(r=>{const a=analyze(r.text||'');let t=esc(r.text);a.bad.forEach(w=>t=t.replaceAll(esc(w),`<span class="bad">${esc(w)}</span>`));a.good.forEach(w=>t=t.replaceAll(esc(w),`<span class="positive">${esc(w)}</span>`));return`<div class="review">${badge(a.level)}<div style="margin-top:8px">${t}</div><div class="muted">불량 ${esc(a.bad.join(', ')||'-')} · 좋은 ${esc(a.good.join(', ')||'-')} · ${esc(r.created_at||'')}</div></div>`}).join('')}
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function loadStores(){try{$('scan').textContent='공식 매장목록 불러오는 중…';const d=await json(API+'/api/stores');const old=new Map(DATA.stores.map(s=>[s.name+'|'+s.address,s]));DATA.stores=(d.stores||[]).map(s=>({...s,reviews:old.get(s.name+'|'+s.address)?.reviews||[],error:null}));save();render();$('scan').textContent=`매장 ${DATA.stores.length}개 준비 완료`;}catch(e){$('scan').innerHTML=`<span class="error">매장목록 실패 · ${esc(e.message)}</span>`;}}
async function ping(){try{const d=await json(API+'/api/ping');$('engine').innerHTML=`<span style="color:#166534">● 실행엔진 연결됨 · ${esc(d.service||'Vercel')} v${esc(d.version||'')}</span>`;return true}catch(e){$('engine').innerHTML=`<span class="error">● 실행엔진 오류 · ${esc(e.message)}</span>`;return false}}
async function run(){if(running)return;if(!DATA.stores.length)await loadStores();if(!DATA.stores.length)return;running=true;$('start').disabled=true;$('stop').disabled=false;$('progress').style.display='block';let ok=0,fail=0;for(let i=0;i<DATA.stores.length&&running;i++){const s=DATA.stores[i];$('progressText').textContent=`${i+1} / ${DATA.stores.length} 매장 검사 중 · 성공 ${ok} · 실패 ${fail}`;$('current').textContent=s.name+' '+s.address;$('bar').style.width=((i+1)/DATA.stores.length*100)+'%';try{const d=await json(API+'/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,address:s.address})});s.reviews=d.reviews||[];s.place_id=d.place_id;s.error=null;ok++;}catch(e){s.error=e.message;fail++;}save();render()}running=false;$('start').disabled=false;$('stop').disabled=true;$('scan').textContent=`검사 완료 · 성공 ${ok} · 실패 ${fail}`;}
$('start').onclick=run;$('stop').onclick=()=>running=false;$('reload').onclick=loadStores;$('search').oninput=render;$('filter').onchange=render;(async()=>{try{DATA=JSON.parse(localStorage.getItem('yd-live-data')||'{"stores":[]}')}catch{}render();if(await ping())await loadStores()})();
</script></body></html>
