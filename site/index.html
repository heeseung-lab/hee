<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>청년다방 리뷰 모니터링</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e8e9ed;--text:#17171a;--muted:#73757d;--red:#c62828;--orange:#a55a00;--green:#166534}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.head h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:7px}.scan{font-size:13px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 12px #00000008}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:6px}.toolbar{display:grid;grid-template-columns:1.3fr 1fr auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.settings textarea{width:100%;padding:12px;border:1px solid #d7d9de;border-radius:11px;background:#fff;font-size:14px}.btn{border:0;border-radius:11px;background:#17171a;color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:1.05fr 1.55fr;gap:14px}.store{padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.store:hover{background:#fafafa}.store:last-child{border:0}.store-top{display:flex;justify-content:space-between;gap:8px}.muted{font-size:12px;color:var(--muted)}.pill{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}.critical{background:#fee2e2;color:#b91c1c}.warning{background:#fef3c7;color:#92400e}.goodpill{background:#dcfce7;color:#166534}.review{padding:15px 0;border-bottom:1px solid #eee}.review:last-child{border:0}.bad{background:#fee2e2;color:#b91c1c;padding:2px 4px;border-radius:4px;font-weight:800}.good{background:#dcfce7;color:#166534;padding:2px 4px;border-radius:4px;font-weight:800}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{border:1px solid #d7d9de;background:#fff;padding:9px 12px;border-radius:999px;cursor:pointer}.tabs .active{background:#17171a;color:#fff}.hidden{display:none}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.error{color:#b91c1c}.empty{padding:30px 10px;text-align:center;color:var(--muted)}@media(max-width:850px){.summary,.layout,.toolbar,.settings{grid-template-columns:1fr}.wrap{padding:16px}.btn{padding:12px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1>청년다방 리뷰 모니터링</h1><div class="sub">최신 네이버플레이스 리뷰 · 불량언어 자동체크 · 위험지점 우선관리</div></div><div class="scan" id="scan">데이터 불러오는 중…</div></div>
<div class="summary">
<div class="card metric"><span>전체 매장</span><b id="mStores">-</b></div>
<div class="card metric"><span>수집 성공</span><b id="mOk">-</b></div>
<div class="card metric"><span>최신 리뷰</span><b id="mReviews">-</b></div>
<div class="card metric"><span>불량 리뷰</span><b id="mBad">-</b></div>
<div class="card metric"><span>집중관리</span><b id="mCritical">-</b></div>
</div>
<div class="tabs"><button class="active" data-tab="dashboard">매장 현황</button><button data-tab="settings">판정 키워드</button><button data-tab="errors">수집 오류</button></div>
<div id="tab-dashboard">
<div class="card toolbar"><input id="search" placeholder="매장명 또는 주소 검색"><select id="filter"><option value="all">전체 등급</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option></select><button class="btn" id="refresh">다시 불러오기</button></div>
<div class="layout"><div class="card"><b>위험 매장 우선순위</b><div id="stores"></div></div><div class="card"><b id="detailTitle">매장을 선택하세요</b><div id="reviews" class="empty">왼쪽 매장을 누르면 최신 리뷰와 감지된 키워드가 표시됩니다.</div></div></div>
</div>
<div id="tab-settings" class="hidden settings"><div class="card"><b>불량언어</b><p class="muted">한 줄에 하나씩 입력하세요. 변경 즉시 현재 데이터가 재판정됩니다.</p><textarea id="badWords" rows="18"></textarea></div><div class="card"><b>좋은언어</b><p class="muted">설정은 현재 브라우저에 저장됩니다.</p><textarea id="goodWords" rows="18"></textarea></div></div>
<div id="tab-errors" class="hidden card"><b>수집 실패 매장</b><div id="errors"></div></div>
</div>
<script>
const DEFAULT_BAD=['불친절','맛없','별로','최악','위생','더럽','머리카락','늦','오래 걸','짜증','불쾌','실망','비싸','재방문 안'];
const DEFAULT_GOOD=['친절','맛있','추천','깨끗','만족','좋아요','재방문','최고'];
let DATA=null, selected=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function words(kind){const key='yd-'+kind;const raw=localStorage.getItem(key);return raw?raw.split('\n').map(x=>x.trim()).filter(Boolean):(kind==='bad'?DEFAULT_BAD:DEFAULT_GOOD)}
function saveWords(){localStorage.setItem('yd-bad',$('badWords').value);localStorage.setItem('yd-good',$('goodWords').value);render()}
function analyze(text){const bad=words('bad').filter(w=>text.includes(w));let good=words('good').filter(w=>text.includes(w));if(text.includes('불친절')||text.includes('친절하지'))good=good.filter(w=>w!=='친절');const score=Math.max(0,bad.length*10-good.length*2);return{bad,good,score,level:score>=20?'critical':score>=10?'warning':'good'}}
function badge(level){return `<span class="pill ${level}">${level==='critical'?'집중관리':level==='warning'?'주의':'정상'}</span>`}
function highlight(text,a){let s=esc(text);[...a.bad].sort((x,y)=>y.length-x.length).forEach(w=>s=s.replaceAll(esc(w),`<span class="bad">${esc(w)}</span>`));[...a.good].sort((x,y)=>y.length-x.length).forEach(w=>s=s.replaceAll(esc(w),`<span class="good">${esc(w)}</span>`));return s}
function storeStats(store){const analyzed=store.reviews.map(r=>analyze(r.text||''));const bad=analyzed.filter(a=>a.bad.length).length;const max=Math.max(0,...analyzed.map(a=>a.score));return{bad,max,level:max>=20?'critical':max>=10?'warning':'good'}}
function render(){if(!DATA)return;const q=$('search').value.trim();const f=$('filter').value;const stores=DATA.stores.map(s=>({...s,_s:storeStats(s)})).filter(s=>(!q||(s.name+s.address).includes(q))&&(f==='all'||s._s.level===f)).sort((a,b)=>b._s.max-a._s.max||b._s.bad-a._s.bad||a.name.localeCompare(b.name));const all=DATA.stores.map(s=>storeStats(s));$('mStores').textContent=DATA.stores_total;$('mOk').textContent=DATA.stores_ok;$('mReviews').textContent=DATA.stores.reduce((n,s)=>n+s.reviews.length,0);$('mBad').textContent=all.reduce((n,s)=>n+s.bad,0);$('mCritical').textContent=all.filter(s=>s.level==='critical').length;$('stores').innerHTML=stores.length?stores.map((s,i)=>`<div class="store" data-i="${DATA.stores.indexOf(s)}"><div class="store-top"><b>${esc(s.name)}</b>${badge(s._s.level)}</div><div class="muted">${esc(s.address)}</div><div class="muted" style="margin-top:4px">리뷰 ${s.reviews.length} · 불량 ${s._s.bad} · 위험점수 ${s._s.max}</div></div>`).join(''):'<div class="empty">조건에 맞는 매장이 없습니다.</div>';document.querySelectorAll('.store').forEach(el=>el.onclick=()=>showStore(DATA.stores[Number(el.dataset.i)]));if(selected)showStore(selected)}
function showStore(store){selected=store;$('detailTitle').textContent=`${store.name} 최신 리뷰`;const rows=store.reviews.map(r=>({r,a:analyze(r.text||'')})).sort((x,y)=>y.a.score-x.a.score);$('reviews').innerHTML=rows.length?rows.map(({r,a})=>`<div class="review">${badge(a.level)}${r.rating?` <b>★ ${r.rating}</b>`:''}<div style="margin:9px 0;line-height:1.75">${highlight(r.text,a)}</div><div class="muted">불량 ${esc(a.bad.join(', ')||'-')} · 좋은 ${esc(a.good.join(', ')||'-')} · ${esc(r.created_at||'')}</div></div>`).join(''):'<div class="empty">리뷰가 없습니다.</div>'}
async function load(){try{const r=await fetch('./data/reviews.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('데이터 파일을 찾지 못했습니다');DATA=await r.json();$('scan').textContent=`최근 검사 ${new Date(DATA.generated_at).toLocaleString('ko-KR')} · 실패 ${DATA.stores_failed}개`;$('errors').innerHTML=DATA.failed.length?DATA.failed.map(x=>`<div class="store"><b>${esc(x.name)}</b><div class="muted">${esc(x.address)}</div><div class="error">${esc(x.error)}</div></div>`).join(''):'<div class="empty">수집 오류가 없습니다.</div>';render()}catch(e){$('scan').innerHTML=`<span class="error">데이터 로딩 실패 · ${esc(e.message)}</span>`}}
$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('badWords').value=words('bad').join('\n');$('goodWords').value=words('good').join('\n');$('badWords').oninput=saveWords;$('goodWords').oninput=saveWords;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','settings','errors'].forEach(t=>$('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab))});load();
</script></body></html>
