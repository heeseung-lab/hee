<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프랜차이즈 리뷰 모니터</title><style>:root{--bg:#f3f6fb;--panel:#fff;--text:#101827;--muted:#687386;--line:#e6ebf2;--accent:#2563eb;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--shadow:0 18px 45px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff 0,#f7f9fc 260px,#f3f6fb 100%);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--text)}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#101827,#1e3a8a 68%,#2563eb);color:white;border-radius:28px;padding:30px;box-shadow:var(--shadow)}.heroRow{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;opacity:.72}.hero h1{font-size:34px;line-height:1.2;margin:8px 0 7px}.hero p{margin:0;color:#dbeafe}.status{margin-top:14px;font-size:13px;color:#bfdbfe}.searchBox{margin-top:22px;display:grid;grid-template-columns:1fr auto;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:10px;border-radius:17px}.searchBox input{border:0;outline:0;background:white;border-radius:12px;padding:15px 16px}.primary{border:0;background:white;color:#1e3a8a;font-weight:900;border-radius:12px;padding:0 22px;cursor:pointer}.ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:white;font-weight:800;border-radius:12px;padding:12px 15px;cursor:pointer}.brandChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.active{background:white;color:#1e3a8a}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.kpi{padding:18px}.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .value{font-size:30px;font-weight:900;margin-top:7px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}.tools{padding:14px;display:grid;grid-template-columns:1.2fr .55fr .55fr auto;gap:9px;margin-bottom:14px}.tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:white}.refresh{border:0;background:#111827;color:#fff;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}.main{display:grid;grid-template-columns:1.05fr 1.45fr;gap:14px}.panel{padding:18px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.panelHead b{font-size:16px}.muted{color:var(--muted);font-size:12px}.storeList{max-height:720px;overflow:auto}.store{border-bottom:1px solid #eef1f5;padding:14px 4px;cursor:pointer}.store:hover{background:#f8fafc}.storeTop{display:flex;justify-content:space-between;gap:12px}.storeName{font-weight:900}.storeMeta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.good{background:#dcfce7;color:#166534}.warning{background:#fef3c7;color:#92400e}.critical{background:#fee2e2;color:#991b1b}.failed{background:#f1f5f9;color:#475569}.review{padding:16px 0;border-bottom:1px solid #eef1f5;line-height:1.65}.reviewText{margin-top:8px;font-size:15px}.markBad{background:#fee2e2;color:#991b1b;padding:1px 3px;border-radius:4px;font-weight:900}.markGood{background:#dcfce7;color:#166534;padding:1px 3px;border-radius:4px;font-weight:900}.empty{padding:52px 14px;text-align:center;color:var(--muted)}.notice{margin-top:12px;border-radius:14px;padding:12px 14px;background:#fff7ed;color:#9a3412;font-size:13px}.sectionTitle{font-size:13px;font-weight:900;color:#334155;margin:8px 0}.kw{display:flex;gap:7px;flex-wrap:wrap}.kw span{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff}.footer{color:#7c8798;font-size:11px;text-align:center;padding:22px}@media(max-width:900px){.shell{padding:14px}.heroRow{display:block}.kpis{grid-template-columns:repeat(2,1fr)}.tools,.main{grid-template-columns:1fr}.searchBox{grid-template-columns:1fr}.primary{padding:14px}.kpis .card:last-child{grid-column:1/-1}}</style></head><body><div class="shell"><section class="hero"><div class="heroRow"><div><div class="eyebrow">FRANCHISE REVIEW MONITOR</div><h1><span id="brandTitle">청년다방</span> 리뷰 대시보드</h1><p>매장별 최신 리뷰를 모아 불량 표현과 긍정 표현을 자동 분류합니다.</p><div id="status" class="status">데이터 확인 중…</div></div><button id="refreshTop" class="ghost">↻ 새로고침</button></div><div class="searchBox"><input id="brandSearch" placeholder="브랜드명을 입력하세요"><button id="brandGo" class="primary">브랜드 조회</button></div><div id="brandChips" class="brandChips"></div></section><section class="kpis"><div class="card kpi"><div class="label">전체 매장</div><div class="value" id="mStores">0</div><div class="sub">조회 대상</div></div><div class="card kpi"><div class="label">수집 성공률</div><div class="value" id="mSuccess">0%</div><div class="sub" id="mSuccessSub">0 / 0</div></div><div class="card kpi"><div class="label">기간내 리뷰</div><div class="value" id="mReviews">0</div><div class="sub" id="mWindow">-</div></div><div class="card kpi"><div class="label">불량 리뷰율</div><div class="value" id="mBad">0%</div><div class="sub" id="mBadSub">0건</div></div><div class="card kpi"><div class="label">집중관리 매장</div><div class="value" id="mCritical">0</div><div class="sub" id="mCriticalSub">0%</div></div></section><section class="card tools"><input id="storeSearch" placeholder="매장명 또는 주소 검색"><select id="stateFilter"><option value="all">전체 상태</option><option value="critical">집중관리</option><option value="warning">주의</option><option value="good">정상</option><option value="failed">수집실패</option></select><select id="sort"><option value="risk">위험도 높은 순</option><option value="name">매장명 순</option><option value="reviews">리뷰 많은 순</option></select><button class="refresh" id="refresh">최신 결과</button></section><section class="main"><div class="card panel"><div class="panelHead"><b>매장 위험도</b><span class="muted" id="storeCount">0개</span></div><div id="storeList" class="storeList"><div class="empty">매장 데이터를 불러오는 중입니다.</div></div></div><div class="card panel"><div class="panelHead"><b id="reviewTitle">리뷰 상세</b><span class="muted" id="reviewCount">-</span></div><div id="reviewList"><div class="empty">왼쪽에서 매장을 선택하세요.</div></div></div></section><div class="footer">GitHub Pages 단일 대시보드 · 데이터는 같은 저장소의 JSON 스냅샷을 사용합니다.</div></div><script>
const BAD=['불친절','맛없','별로','최악','위생','더럽','머리카락','늦','오래 걸','짜증','불쾌','실망','비싸','재방문 안','엉망','차갑'];
const GOOD=['친절','맛있','추천','깨끗','만족','좋아요','재방문','최고','깔끔','푸짐','빠르'];
let INDEX={brands:[]},REGISTRY={brands:[]},DATA={brand:'청년다방',stores:[],window_days:2},selected=null;
const $=id=>document.getElementById(id);const pct=(a,b)=>b?((a/b)*100).toFixed(1):'0.0';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function analyze(text=''){const bad=BAD.filter(w=>text.includes(w));let good=GOOD.filter(w=>text.includes(w));if(text.includes('불친절')||text.includes('친절하지'))good=good.filter(w=>w!=='친절');const score=Math.max(0,bad.length*10-good.length*2);return{bad,good,score,level:score>=20?'critical':score>=10?'warning':'good'}}
function storeStat(s){if(s.error)return{level:'failed',bad:0,score:0};const arr=(s.reviews||[]).map(r=>analyze(r.text||''));const score=arr.length?Math.max(...arr.map(x=>x.score)):0;return{level:score>=20?'critical':score>=10?'warning':'good',bad:arr.filter(x=>x.bad.length).length,score}}
function badge(level){const name={critical:'집중관리',warning:'주의',good:'정상',failed:'수집실패'}[level]||level;return `<span class="pill ${level}">${name}</span>`}
async function getJson(path){const r=await fetch(path+(path.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function loadMeta(){try{INDEX=await getJson('./data/brands/index.json')}catch{INDEX={brands:[]}}try{REGISTRY=await getJson('./data/brands/registry.json')}catch{REGISTRY={brands:[]}}renderChips()}
function availableBrands(){return [...new Set(['청년다방',...(REGISTRY.brands||[]),...(INDEX.brands||[]).map(x=>x.name)].filter(Boolean))]}
function renderChips(){const now=DATA.brand;$('brandChips').innerHTML=availableBrands().map(b=>`<button class="chip ${b===now?'active':''}" data-brand="${esc(b)}">${esc(b)}</button>`).join('');document.querySelectorAll('[data-brand]').forEach(x=>x.onclick=()=>loadBrand(x.dataset.brand))}
async function loadBrand(brand){brand=String(brand||'').trim();if(!brand)return;$('brandSearch').value=brand;$('status').textContent=`${brand} 데이터 불러오는 중…`;selected=null;try{let d;if(brand==='청년다방')d=await getJson('./data/reviews.json');else{const meta=(INDEX.brands||[]).find(x=>x.name===brand);if(!meta)throw Error((REGISTRY.brands||[]).includes(brand)?'WAITING':'NOT_FOUND');d=await getJson('./data/brands/'+encodeURIComponent(meta.slug)+'.json')}DATA={brand,stores:d.stores||[],window_days:d.window_days||2,window_label:d.window_label||'',generated_at:d.generated_at||'',stores_ok:d.stores_ok,stores_failed:d.stores_failed};$('brandTitle').textContent=brand;$('status').textContent=`${brand} · ${DATA.window_label||('최근 '+DATA.window_days+'일')} · 마지막 갱신 ${formatTime(DATA.generated_at)}`;renderChips();render();}catch(e){DATA={brand,stores:[],window_days:2};$('brandTitle').textContent=brand;renderChips();render();$('status').textContent=e.message==='WAITING'?`${brand} · 첫 데이터 수집 대기 중`:`${brand} · 저장된 데이터가 없습니다`;}}
function formatTime(v){if(!v)return '-';try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
function render(){const rows=DATA.stores.map((s,i)=>({s,i,st:storeStat(s)}));const total=rows.length,failed=rows.filter(x=>x.st.level==='failed').length,ok=total-failed,reviews=rows.reduce((n,x)=>n+(x.s.reviews?.length||0),0),bad=rows.reduce((n,x)=>n+x.st.bad,0),critical=rows.filter(x=>x.st.level==='critical').length;$('mStores').textContent=total;$('mSuccess').textContent=pct(ok,total)+'%';$('mSuccessSub').textContent=`${ok} / ${total}`;$('mReviews').textContent=reviews;$('mWindow').textContent=DATA.window_label||('최근 '+(DATA.window_days||2)+'일');$('mBad').textContent=pct(bad,reviews)+'%';$('mBadSub').textContent=`불량 ${bad}건`;$('mCritical').textContent=critical;$('mCriticalSub').textContent=pct(critical,total)+'%';renderStores(rows)}
function renderStores(rows){const q=$('storeSearch').value.trim(),f=$('stateFilter').value,sort=$('sort').value;let list=rows.filter(x=>(!q||((x.s.name||'')+(x.s.address||'')).includes(q))&&(f==='all'||x.st.level===f));if(sort==='risk')list.sort((a,b)=>({critical:4,warning:3,failed:2,good:1}[b.st.level]-({critical:4,warning:3,failed:2,good:1}[a.st.level])||b.st.score-a.st.score);if(sort==='name')list.sort((a,b)=>(a.s.name||'').localeCompare(b.s.name||''));if(sort==='reviews')list.sort((a,b)=>(b.s.reviews?.length||0)-(a.s.reviews?.length||0));$('storeCount').textContent=list.length+'개';$('storeList').innerHTML=list.length?list.map(x=>`<div class="store" data-index="${x.i}"><div class="storeTop"><div><div class="storeName">${esc(x.s.name||'매장')}</div><div class="storeMeta">${esc(x.s.address||'주소 없음')}</div></div>${badge(x.st.level)}</div><div class="storeMeta">리뷰 ${x.s.reviews?.length||0} · 불량 ${x.st.bad}${x.s.error?' · 수집실패':''}</div></div>`).join(''):'<div class="empty">조건에 맞는 매장이 없습니다.</div>';document.querySelectorAll('[data-index]').forEach(el=>el.onclick=()=>showStore(DATA.stores[+el.dataset.index]))}
function showStore(s){selected=s;$('reviewTitle').textContent=s.name+' 리뷰';$('reviewCount').textContent=(s.reviews?.length||0)+'건';if(!s.reviews?.length){$('reviewList').innerHTML=`<div class="empty">${s.error?`수집 실패: ${esc(s.error)}`:'해당 기간 리뷰가 없습니다.'}</div>`;return}$('reviewList').innerHTML=s.reviews.map(r=>{const a=analyze(r.text||'');let t=esc(r.text||'');a.bad.forEach(w=>t=t.replaceAll(esc(w),`<span class="markBad">${esc(w)}</span>`));a.good.forEach(w=>t=t.replaceAll(esc(w),`<span class="markGood">${esc(w)}</span>`));return `<div class="review">${badge(a.level)}<div class="reviewText">${t}</div><div class="storeMeta">${esc(r.created_at||'')} · 불량 ${esc(a.bad.join(', ')||'-')} · 긍정 ${esc(a.good.join(', ')||'-')}</div></div>`}).join('')}
async function refresh(){await loadMeta();await loadBrand(DATA.brand||'청년다방')}
$('brandGo').onclick=()=>loadBrand($('brandSearch').value);$('brandSearch').onkeydown=e=>{if(e.key==='Enter')loadBrand(e.target.value)};$('storeSearch').oninput=render;$('stateFilter').onchange=render;$('sort').onchange=render;$('refresh').onclick=refresh;$('refreshTop').onclick=refresh;(async()=>{await loadMeta();await loadBrand('청년다방')})();
</script></body></html>
