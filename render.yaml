services:
  - type: web
    name: youngdabang-review-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/reviews.db
      - key: SECRET_KEY
        generateValue: true
      - key: JOB_TOKEN
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: review-data
      mountPath: /var/data
      sizeGB: 1
