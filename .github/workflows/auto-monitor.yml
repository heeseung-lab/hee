name: auto-monitor-all-brands

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-monitor.yml'
      - 'site/data/brands/registry.json'
      - 'app/brand_export.py'
      - 'app/refresh_all_brands.py'
      - 'app/naver_crawler.py'
      - 'app/export_static.py'
  schedule:
    # 09:00 / 18:00 KST
    - cron: '0 0,9 * * *'

permissions:
  contents: write

concurrency:
  group: auto-monitor-all-brands
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect Youngdabang (today + yesterday)
        run: python -m app.export_static
      - name: Auto discover stores and inspect registered brands
        run: python -m app.refresh_all_brands
      - name: Save monitoring snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/reviews.json site/data/brands
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: auto refresh all monitored brands"
          git pull --rebase origin main
          git push origin HEAD:main
