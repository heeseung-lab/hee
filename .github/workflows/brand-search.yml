name: brand-search-and-reviews

on:
  workflow_dispatch:
    inputs:
      brand:
        description: '브랜드명 (예: 한마음정육식당)'
        required: true
        type: string
      days:
        description: '조회 기간(일)'
        required: true
        default: '7'
        type: string
  push:
    branches: [main]
    paths:
      - 'app/brand_export.py'
      - '.github/workflows/brand-search.yml'

permissions:
  contents: write

concurrency:
  group: brand-search-${{ github.event.inputs.brand || 'seed-brand' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRAND: ${{ github.event.inputs.brand || '한마음정육식당' }}
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover stores from Naver Map and collect reviews
        run: python -m app.brand_export --brand "$BRAND" --days "$DAYS"
      - name: Save brand snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/brands
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: refresh brand $BRAND"
          git pull --rebase origin main
          git push origin HEAD:main
